name: CI

on:
  pull_request:
    branches:
    - main
    paths-ignore:
    - .editorconfig
    - .gitignore
    - LICENSE.md
    - README.md
  push:
    branches:
    - main
    paths-ignore:
    - .editorconfig
    - .gitignore
    - LICENSE.md
    - README.md

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    - name: Setup the CloudFormation linter
      uses: scottbrenner/cfn-lint-action@v2.8.0
    - name: Lint the CloudFormation stacks
      run: |
        shopt -s globstar
        cfn-lint --version
        cfn-lint -t ./*.yaml
